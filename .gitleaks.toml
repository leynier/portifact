# Secret scanning rules for CI's `secrets` job (gitleaks, docs/releasing.md). The default rules
# apply; the allowlist below only drops false positives, each with the reason it is safe.

[extend]
useDefault = true

# Idempotency keys in tests ("idempotency-key": "invalid-key-02", idempotencyKey: "parity-once-1")
# are request identifiers that any client picks, not credentials; the generic-api-key rule reads
# the word "key" in their name. Only a match that is an idempotency key name and its value is
# dropped; every other rule still applies to the same files.
[[allowlists]]
description = "Idempotency keys are request identifiers, not secrets"
regexTarget = "match"
regexes = ['''(?i)^idempotency[-_]?key"?\s*[:=]\s*"[a-z0-9-]+"$''']

# The unsubscribe page's accessibility test opens the page with a made-up link token: the format's
# prefix, the base64 of the words "user" and "signature", and no key. It signs nothing and no
# Worker would accept it. Only that exact value is dropped.
[[allowlists]]
description = "The unsubscribe page test's placeholder token is not a credential"
regexTarget = "match"
regexes = ['''cn1\.dXNlcg\.1\.c2lnbmF0dXJl''']

# Portifact's SCIM tokens (decision 0017): `pfsc_` and 43 base64url characters, 32 random bytes,
# a workspace directory's credential. A real one in the repository is a leak: revoke it
# (docs/operations.md, "A leaked SCIM token"). Tests build sample tokens at run time; never
# allowlist this rule.
[[rules]]
id = "portifact-scim-token"
description = "Portifact SCIM token"
regex = '''pfsc_[A-Za-z0-9_-]{43}'''
keywords = ["pfsc_"]

# Portifact's own service tokens (decision 0011): `pfst_` and 43 base64url characters, 32 random
# bytes. A real one in the repository is a leak: revoke it (docs/operations.md, "A leaked service
# token"). Tests build sample tokens at run time and documents write `pfst_…`, so nothing
# committed matches; never allowlist this rule.
[[rules]]
id = "portifact-service-token"
description = "Portifact service token"
regex = '''pfst_[A-Za-z0-9_-]{43}'''
keywords = ["pfst_"]

# The email domain proof's tests use a made-up TXT token: the hex digits in order, twice. It is a
# placeholder for a value that is published in public DNS anyway, never a credential. Only that
# exact value is dropped.
[[allowlists]]
description = "The email domain proof test's placeholder token is not a credential"
regexTarget = "match"
regexes = ['''0123456789abcdef0123456789abcdef''']

# In a language catalog, a message that ends with a word such as "token" or "key" is followed by
# the next message's key (`"integrations.howto.jira.2":`), and the generic-api-key rule reads that
# key as the token's value. A catalog key is words joined by dots, written in the source for every
# reader, never a credential. Only a value of that shape, found by that rule in a language catalog,
# is dropped; every other rule still applies to the same files.
[[allowlists]]
description = "A catalog key after a message ending in \"token\" is not a secret"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/web/src/(dashboard|auth)/i18n/[a-z-]+\.ts$''']
regexes = ['''^[a-z][A-Za-z0-9]*(\.[A-Za-z0-9_]+){2,}$''']

# One commit of PR #270 (artifact data's owner API) wrote a test-only idempotency key next to
# `idempotencyKey,` in `apps/app/test/data.test.ts`, which the generic-api-key rule reads as a
# credential; a later commit builds it at run time. The pull request is squash-merged, so this
# commit never reaches `develop`; only that commit, that file and that rule are dropped.
[[allowlists]]
description = "A test-only idempotency key in one commit of PR #270, not carried into develop"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["d8be5ab3ef7441b480adc9dad4d31720ecacd9a4"]
paths = ['''^apps/app/test/data\.test\.ts$''']
