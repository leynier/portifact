name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # The deploy key is the only actor allowed to push the version commit to main and sync develop.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

      - name: Version, build and publish the GitHub release
        id: semantic
        run: npx --no semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        if: steps.semantic.outputs.version != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip

      # Runs after every push to main, with or without a release, so main is never ahead of develop.
      # Fast-forward keeps both branches on the same commit; a merge is only needed if develop moved meanwhile.
      - name: Sync develop with main
        run: |
          git fetch origin main develop
          git checkout -B develop origin/develop
          if git merge-base --is-ancestor origin/develop origin/main; then
            git merge --ff-only origin/main
          else
            git merge --no-ff origin/main -m "chore: sync main into develop [skip ci]"
          fi
          git push origin develop

  # Deploys portifact.com after every push to main, released or not, so the site matches main.
  deploy:
    name: deploy
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Apply D1 migrations
        working-directory: apps/content
        run: npx wrangler d1 migrations apply portifact-control --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the content Worker
        working-directory: apps/content
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the jobs Worker
        working-directory: apps/jobs
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the app Worker
        working-directory: apps/app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the deployed site
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://portifact.com/ | grep -q "Share what your agent built"; then break; fi
            if [ "$attempt" = 6 ]; then echo "portifact.com did not serve the landing page" >&2; exit 1; fi
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://portifact.com/install)" = 302
      - name: Check the authorization server
        run: |
          # The first deploy creates the app.portifact.com custom domain; its certificate can
          # take a few minutes.
          metadata=https://app.portifact.com/.well-known/oauth-authorization-server/api/auth
          for attempt in $(seq 1 18); do
            if curl -fsS "$metadata" | grep -q '"issuer":"https://app.portifact.com/api/auth"'; then break; fi
            if [ "$attempt" = 18 ]; then echo "app.portifact.com did not serve its metadata" >&2; exit 1; fi
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://app.portifact.com/login)" = 200
