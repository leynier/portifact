name: cla

# A pull request into develop passes only when every contributor signed the contributor license
# agreement and confirmed it with their own comment on the pull request (cla.md, contributing.md,
# docs/releasing.md "Contributor license agreement"). It runs on pull_request_target so the
# workflow and the check (scripts/cla.ts) always come from the base branch: a pull request cannot
# edit the check it is judged by. Nothing from the pull request is checked out or run; its data is
# read through the API, with a read-only token and no secrets.
on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Also covers the issue comments endpoint for a pull request's comments, as GitHub's
      # permission table lists it under "Pull requests".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch's tip, the same commit this workflow file comes from. The pull
          # request's own base.sha can be older than the workflow, and then the workflow would
          # run a check script that does not match it.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Read the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cla"
          mkdir -p "$dir"
          before=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.sha) \(.commits) \(.changed_files)"')
          gh api "repos/$REPO/pulls/$PR/commits?per_page=100" --paginate \
            --jq '.[] | {sha, id: .author.id, login: .author.login, committerId: .committer.id, committer: .committer.login, verified: .commit.verification.verified, message: .commit.message}' \
            > "$dir/commits.jsonl"
          gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '.[] | {id, userId: .user.id, login: .user.login, body, createdAt: .created_at, updatedAt: .updated_at, url: .html_url}' \
            > "$dir/comments.jsonl"
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
            --jq '.[] | {filename, previous: .previous_filename}' > "$dir/files.jsonl"
          # A file missing at the head leaves no file, which the check refuses; any other failed
          # read stops the step.
          read_head() {
            if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/$1?ref=$HEAD_SHA" > "$dir/$2" 2> "$dir/error"; then
              grep -q "HTTP 404" "$dir/error" || { cat "$dir/error"; exit 1; }
              rm -f "$dir/$2"
            fi
          }
          read_head cla-signers.md head-signers.md
          read_head cla.md head-cla.md
          after=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          jq -n --arg before "$before" --arg after "$after" --arg head "$HEAD_SHA" \
            --arg login "$AUTHOR" --argjson id "$AUTHOR_ID" \
            '{authorId: $id, authorLogin: $login, eventHeadSha: $head,
              headShaBefore: ($before | split(" ")[0]), headShaAfter: $after,
              reportedCommits: ($before | split(" ")[1] | tonumber),
              reportedFiles: ($before | split(" ")[2] | tonumber)}' > "$dir/pull-request.json"
      - name: Check the signatures
        run: bun scripts/cla-main.ts "$RUNNER_TEMP/cla"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cla-evidence
          path: |
            ${{ runner.temp }}/cla/evidence.json
            ${{ runner.temp }}/cla/pull-request.json
            ${{ runner.temp }}/cla/comments.jsonl
            ${{ runner.temp }}/cla/commits.jsonl
            ${{ runner.temp }}/cla/files.jsonl
          retention-days: 90
          if-no-files-found: ignore
