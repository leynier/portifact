name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
  # Runs on develop after each merge so the README status and coverage badges reflect it.
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs the change needs (scripts/ci-scope.ts). Jobs it rules out are skipped,
  # which required checks accept. Pull requests into main always run everything, and if this
  # job fails the others run anyway: the scope can only save time, never skip a check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      cli: ${{ steps.scope.outputs.cli }}
      e2e: ${{ steps.scope.outputs.e2e }}
      secrets_history: ${{ steps.scope.outputs.secrets_history }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ github.base_ref == 'main' && 'full' || 'diff' }}
        run: bun scripts/ci-scope-main.ts "$BASE_SHA" "$HEAD_SHA" "$MODE"

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: shellcheck scripts/*.sh
      - run: node scripts/check-release-notes.mjs
      - name: Validate the app Worker bundle
        working-directory: apps/app
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/app-worker"
      - name: Validate the content Worker bundle
        working-directory: apps/content
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/content-worker"
      - name: Validate the jobs Worker bundle
        working-directory: apps/jobs
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/jobs-worker"

  # Playwright end to end in Chromium, Firefox and WebKit (e2e/, docs/testing.md), with the
  # browsers' system libraries installed, so WebKit runs here even though it needs libraries
  # most workstations lack. On Linux WebKit has no partitioned cookies and covers the fallback.
  e2e:
    name: e2e
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install the browsers and their system libraries
        run: bun run --cwd e2e browsers --with-deps
      - run: bun run test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Secret scanning with gitleaks (.gitleaks.toml), pinned by version and SHA-256. Every run
  # scans the change's own commits and the checked-out tree, since any file can hold a secret;
  # the whole history is scanned again when the scope says so (scripts/ci-scope.ts: the rules or
  # this workflow changed, a pull request into main, or a range it could not compute). Findings
  # are redacted in the log.
  secrets:
    name: secrets
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          # Authenticated downloads skip the anonymous limits that answer 504 under load.
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
              --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            sleep 5
          done
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan the change's commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Without a usable base (a new branch, a rewritten one), changes outputs the full
          # scope, so the history scan below covers this run.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit; the history scan covers this run."
            exit 0
          fi
          gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan the checked-out tree
        run: gitleaks dir --no-banner --redact --verbose .
      - name: Scan the whole history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.secrets_history != 'false' }}
        run: gitleaks git --no-banner --redact --verbose .

  coverage-badge:
    name: coverage-badge
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Publish coverage to the badges branch
        run: |
          bun scripts/coverage-badge.ts > "$RUNNER_TEMP/coverage.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges 2>/dev/null; then
            git worktree add -B badges "$RUNNER_TEMP/badges" origin/badges
          else
            git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          fi
          cp "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/badges/coverage.json"
          cd "$RUNNER_TEMP/badges"
          git add coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badge"
            git push origin badges
          fi

  pr-title:
    name: pr-title
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  main-source:
    name: main-source
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only develop can be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Pull requests into main must come from develop (got '$HEAD_REF')." >&2
            exit 1
          fi

  build:
    name: build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:cli -- --all
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/
          retention-days: 3

  smoke-linux-distros:
    name: smoke (linux-distros)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/release
      - run: bash scripts/smoke-linux-distros.sh dist/release

  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/release
      - name: Install with install.sh and run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PORTIFACT_DOWNLOAD_URL="file://$PWD/dist/release" PORTIFACT_INSTALL_DIR="$RUNNER_TEMP/bin" \
            PORTIFACT_NO_MODIFY_PATH=1 bash scripts/install.sh
          "$RUNNER_TEMP/bin/portifact" --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'
          "$RUNNER_TEMP/bin/portifact" | grep -q 'early development'
      - name: Install with install.ps1 and run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PORTIFACT_DOWNLOAD_URL = Join-Path $PWD 'dist\release'
          $env:PORTIFACT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          $env:PORTIFACT_NO_MODIFY_PATH = '1'
          ./scripts/install.ps1
          $exe = Join-Path $env:PORTIFACT_INSTALL_DIR 'portifact.exe'
          $version = & $exe --version
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Unexpected version output: $version" }
          # The installed executable must match the machine: arm64 runners must not get the x64 build.
          $machine = [System.BitConverter]::ToUInt16([System.IO.File]::ReadAllBytes($exe), [System.BitConverter]::ToInt32([System.IO.File]::ReadAllBytes($exe), 0x3C) + 4)
          $expected = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ('Installed binary machine type 0x{0:X} does not match 0x{1:X}' -f $machine, $expected) }
