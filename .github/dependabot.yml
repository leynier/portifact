version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Major 10 needs conventional-changelog-writer 9, which semantic-release's
      # release-notes-generator does not load yet; scripts/check-release-notes.mjs catches it.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
